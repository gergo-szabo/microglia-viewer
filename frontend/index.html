<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Microglia Viewer</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
<div id="app">

  <!-- ── Sidebar ────────────────────────────────────── -->
  <aside id="sidebar">

    <div class="section">
      <div class="section-title">Load File</div>
      <div id="dropzone">
        <input type="file" id="file-input" accept=".nd2" />
        <div>Drop .nd2 file here<br><small>or click to browse</small></div>
      </div>
      <div id="upload-status"></div>
    </div>

    <div class="section">
      <div class="section-title">Files</div>
      <div id="file-list"><div style="color:var(--text2);font-size:12px;padding:4px 2px;">No files loaded</div></div>
    </div>

    <div class="section">
      <div class="section-title">Navigation</div>

      <div style="margin-bottom:8px;">
        <div class="ctrl-label" style="width:auto;margin-bottom:5px;">Channel</div>
        <div id="channel-btns" class="channel-btns"></div>
      </div>

      <div class="z-block">
        <span class="ctrl-label" style="width:auto;">Z slice</span>
        <div class="z-widgets">
          <button class="step-btn" id="z-dec">&#8722;</button>
          <input type="range" id="z-slider" min="0" max="0" value="0" />
          <span class="ctrl-value" id="z-val">0</span>
          <button class="step-btn" id="z-inc">&#43;</button>
        </div>
      </div>

      <div class="ctrl-row" id="t-row" style="display:none;">
        <span class="ctrl-label">Timepoint</span>
        <input type="range" id="t-slider" min="0" max="0" value="0" />
        <span class="ctrl-value" id="t-val">0</span>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Analysis</div>

      <div class="ctrl-row" style="margin-bottom:10px;">
        <span class="ctrl-label">Segmenter</span>
        <select id="segmenter-select" style="flex:1;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:12px;"></select>
      </div>

      <button id="btn-run" disabled>Run Analysis</button>
    </div>

    <!-- Progress -->
    <div id="progress-wrap">
      <div id="progress-label">Ready</div>
      <div id="progress-bar-outer">
        <div id="progress-bar-inner"></div>
      </div>
    </div>

    <!-- Results -->
    <div class="section" id="results-section">
      <div class="section-title">Results</div>
      <div id="result-kv-list"></div>

      <div id="overlay-controls" style="display:none;margin-top:12px;">
        <div class="section-title" style="margin-bottom:6px;">Segmentation Overlay</div>
        <label class="mask-row"><input type="checkbox" id="mask-branches" checked /><span class="mask-dot branches"></span>Branches</label>
        <label class="mask-row"><input type="checkbox" id="mask-soma" checked /><span class="mask-dot soma"></span>Soma</label>
        <label class="mask-row"><input type="checkbox" id="mask-nucleus" checked /><span class="mask-dot nucleus"></span>Nucleus</label>
      </div>

      <div class="graph-tabs" style="margin-top:12px;">
        <button class="graph-tab active" data-tab="resolution">
          <img class="graph-thumb" id="thumb-resolution" alt="" />
          Resolution
        </button>
        <button class="graph-tab" data-tab="correlations">
          <img class="graph-thumb" id="thumb-correlations" alt="" />
          Correlation
        </button>
        <button class="graph-tab" data-tab="coherences">
          <img class="graph-thumb" id="thumb-coherences" alt="" />
          Coherence
        </button>
      </div>
    </div>

  </aside>

  <!-- ── Viewer ──────────────────────────────────────── -->
  <div id="viewer-area">
    <div id="osd-container"></div>

    <div id="statusbar">
      <span id="sb-version">Microglia Viewer</span>
      <span id="sb-dim"></span>
      <span id="sb-channel"></span>
      <span id="sb-coord"></span>
    </div>
  </div>
